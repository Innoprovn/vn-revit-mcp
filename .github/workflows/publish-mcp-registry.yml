name: Đăng lên MCP Registry

# Đăng server.json lên registry.modelcontextprotocol.io khi phát hành bản mới (hoặc chạy tay).
# Xác thực bằng GitHub OIDC: không cần token, registry tin namespace io.github.Innoprovn từ chính repo này.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Đăng nhập (OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Đăng
        run: ./mcp-publisher publish
